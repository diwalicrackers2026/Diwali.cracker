<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandyan's Crackers - Price List 2026 & Order</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,500;0,700;0,800;1,800&family=Noto+Sans+Tamil:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#231F6B; --ink-soft:#5A56A0; --red:#D9291C; --red-dark:#B01E13; --yellow:#FFE600; --gold:#FFD21F;
  --line:#D9D7EE; --wash:#F4F3FB; --white:#fff; --ok:#1B7F3B;
  --font:"Archivo","Noto Sans Tamil",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:128px}
body{margin:0;font-family:var(--font);color:var(--ink);background:var(--white);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto}

/* header */
.top{background:var(--ink);color:var(--white);padding:18px 16px 16px;text-align:center;border-bottom:6px solid var(--yellow)}
.blessing{font-size:12px;letter-spacing:.02em;color:var(--gold);margin:0 0 2px}
.brand{font-weight:800;font-style:italic;font-size:44px;line-height:1;margin:0;color:var(--white);transform:rotate(-2deg);display:inline-block;text-shadow:3px 3px 0 var(--red)}
.tag{margin:10px 0 0;font-size:15px;color:#E6E4FA}
.call{display:inline-block;margin-top:10px;padding:8px 14px;border:2px solid var(--yellow);border-radius:999px;color:var(--yellow);text-decoration:none;font-weight:700;font-size:14px}

/* sticky finder */
.finder{position:sticky;top:0;z-index:20;background:var(--white);border-bottom:1px solid var(--line);padding:10px 12px 8px}
.search{width:100%;padding:11px 14px;border:2px solid var(--ink);border-radius:10px;font-size:16px;background:var(--white)}
.search::placeholder{color:#8886B8}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--ink);background:var(--white);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap}
.chip:hover{background:var(--wash)}
.chip.in{background:var(--ink);color:var(--white)}

/* list */
.band{background:var(--yellow);color:var(--red);font-weight:800;text-align:center;padding:7px 10px;font-size:15px;margin:0;border-top:1px solid #E5CF00;border-bottom:1px solid #E5CF00}
.row{display:grid;grid-template-columns:34px 1fr auto auto;gap:6px 8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
.row.on{background:#FFF9B8}
.no{color:#C2185B;font-weight:700;font-size:13px;text-align:right}
.nm{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.nm small{display:block;font-weight:500;font-size:12px;color:var(--ink-soft)}
.pr{font-weight:800;font-size:16px;text-align:right;min-width:58px;font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;border:2px solid var(--ink);border-radius:9px;overflow:hidden;background:var(--white)}
.stp button{width:34px;height:36px;border:0;background:var(--white);font-size:20px;font-weight:800;line-height:1;color:var(--ink)}
.stp button:active{background:var(--gold)}
.stp input{width:38px;height:36px;border:0;border-left:1px solid var(--line);border-right:1px solid var(--line);text-align:center;font-weight:800;font-size:15px;background:var(--white);padding:0;-moz-appearance:textfield}
.stp input::-webkit-outer-spin-button,.stp input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.empty{padding:36px 16px;text-align:center;color:var(--ink-soft)}
.foot{padding:22px 16px 120px;text-align:center;font-size:13px;color:var(--ink-soft)}
.foot b{color:var(--ink)}

/* order bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--ink);color:var(--white);padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:4px solid var(--yellow)}
.bar-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px;justify-content:space-between}
.sum{font-size:13px;color:#E6E4FA}
.sum strong{display:block;font-size:22px;color:var(--white);font-variant-numeric:tabular-nums}
.btn{border:0;border-radius:10px;background:var(--red);color:var(--white);font-weight:800;padding:12px 18px;font-size:16px}
.btn:hover{background:var(--red-dark)}
.btn[disabled]{background:#6F6BAA;cursor:not-allowed}
.btn.alt{background:var(--white);color:var(--ink);border:2px solid var(--ink)}
.btn.confirm{background:var(--ok);width:100%;font-size:18px;padding:14px 18px}
.btn.confirm:hover{background:#14652E}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;background:var(--white);overflow-y:auto;display:none}
.sheet.open{display:block}
.sheet-in{max-width:620px;margin:0 auto;padding:0 16px 40px}
.sheet-head{position:sticky;top:0;background:var(--white);display:flex;justify-content:space-between;align-items:center;padding:14px 0 10px;border-bottom:3px solid var(--yellow);z-index:2}
.sheet-head h2{margin:0;font-size:22px}
.x{border:2px solid var(--ink);background:var(--white);border-radius:9px;width:40px;height:40px;font-size:22px;font-weight:800;line-height:1}
.sheet h3{font-size:17px;margin:22px 0 8px}
.line{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.line .nm small{display:inline}
.line .stp{grid-column:1;justify-self:start}
.line .lt{font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:20px;padding:12px 0 2px}
.fine{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
label{display:block;font-weight:700;font-size:14px;margin:12px 0 4px}
.in{width:100%;padding:11px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--white);font-size:16px}
textarea.in{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red-dark);font-size:13px;font-weight:700;margin:4px 0 0;min-height:0}
.in.bad{border-color:var(--red);background:#FFF1EF}
.done{text-align:center;padding:30px 4px}
.done h2{font-size:26px;margin:8px 0}
.oid{display:inline-block;background:var(--yellow);color:var(--red);font-weight:800;font-size:22px;padding:6px 14px;border-radius:8px;margin:6px 0 12px}
.stack{display:grid;gap:10px;margin-top:14px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--ink);color:var(--white);padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;z-index:90;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media (max-width:380px){.brand{font-size:38px}.row{grid-template-columns:28px 1fr auto;}.row .stp{grid-column:2 / 4;justify-self:end}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

});
</script>

const inr = n => "₹" + Number(n).toLocaleString("en-IN");
const $ = s => document.querySelector(s);
const qty = {};            // id -> number
const byId = {};
SECTIONS.forEach(s => s.items.forEach(i => byId[i.id] = i));
let orderId = null;
let view = "form";

try { Object.assign(qty, JSON.parse(localStorage.getItem("pandyan_cart") || "{}")); } catch(e){}
Object.keys(qty).forEach(k => { if(!byId[k] || !(qty[k] > 0)) delete qty[k]; });
const saveCart = () => { try { localStorage.setItem("pandyan_cart", JSON.stringify(qty)); } catch(e){} };

/* header + footer */
$("#callLink").href = "tel:+91" + SHOP.phones[0];
$("#callLink").textContent = "Call " + SHOP.phones[0].replace(/(\d{5})(\d{5})/,"$1 $2");
$("#foot").innerHTML = "<b>"+SHOP.name+"</b><br>"+SHOP.address+"<br>"+SHOP.phones.join(" | ")+"<br>"+SHOP.email;

/* list */
function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function rowHTML(i){
  const n = qty[i.id]||0;
  return `<div class="row${n?" on":""}" data-id="${i.id}">
    <span class="no">${i.no}.</span>
    <div class="nm">${esc(i.name)}<small>per ${esc(i.per)}</small></div>
    <div class="pr">${inr(i.price)}</div>
    <div class="stp">
      <button type="button" data-d="-1" aria-label="Remove one ${esc(i.name)}">−</button>
      <input type="number" inputmode="numeric" min="0" max="999" value="${n}" aria-label="Quantity of ${esc(i.name)}">
      <button type="button" data-d="1" aria-label="Add one ${esc(i.name)}">+</button>
    </div></div>`;
}
function render(filter){
  const f = (filter||"").trim().toLowerCase();
  let html = "", chips = "";
  SECTIONS.forEach((s,si)=>{
    const items = f ? s.items.filter(i => (i.name+" "+s.name).toLowerCase().includes(f)) : s.items;
    if(!items.length) return;
    chips += `<button class="chip" type="button" data-s="${si}">${esc(s.name)}</button>`;
    html += `<h2 class="band" id="sec${si}">${esc(s.name)}</h2>` + items.map(rowHTML).join("");
  });
  $("#list").innerHTML = html || `<p class="empty">No crackers match "${esc(filter)}". Try a shorter word.</p>`;
  $("#chips").innerHTML = chips;
}
function setQty(id, n){
  n = Math.max(0, Math.min(999, parseInt(n,10)||0));
  if(n) qty[id]=n; else delete qty[id];
  saveCart();
  document.querySelectorAll(`.row[data-id="${id}"]`).forEach(r=>{
    r.classList.toggle("on", !!n);
    const inp = r.querySelector("input"); if(document.activeElement!==inp) inp.value = n;
  });
  summary();
  if($("#sheet").classList.contains("open") && view==="form") renderSheet();
}
function totals(){
  let c=0,t=0; for(const k in qty){ c+=qty[k]; t+=qty[k]*byId[k].price; }
  return {lines:Object.keys(qty).length, units:c, total:t};
}
function summary(){
  const t = totals();
  $("#cnt").textContent = t.lines + (t.lines===1?" item":" items");
  $("#tot").textContent = inr(t.total);
  $("#viewBtn").disabled = !t.lines;
}
$("#list").addEventListener("click", e=>{
  const b = e.target.closest("button[data-d]"); if(!b) return;
  const id = b.closest(".row").dataset.id;
  setQty(id, (qty[id]||0) + (+b.dataset.d));
});
$("#list").addEventListener("input", e=>{
  if(e.target.matches(".stp input")) setQty(e.target.closest(".row").dataset.id, e.target.value);
});
$("#list").addEventListener("change", e=>{ if(e.target.matches(".stp input")) e.target.value = qty[e.target.closest(".row").dataset.id]||0; });
$("#q").addEventListener("input", e=>render(e.target.value));
$("#chips").addEventListener("click", e=>{
  const c = e.target.closest(".chip"); if(!c) return;
  document.querySelectorAll(".chip").forEach(x=>x.classList.remove("in")); c.classList.add("in");
  $("#sec"+c.dataset.s).scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches?"auto":"smooth"});
});

/* order sheet */
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove("show"),2200)}
function newId(){return "PY"+Date.now().toString(36).slice(-5).toUpperCase()}
const formState = (function(){try{return JSON.parse(localStorage.getItem("pandyan_form")||"{}")}catch(e){return{}}})();
function esc2(v){return esc(v||"")}

function renderSheet(){
  view="form";
  const t = totals();
  if(!t.lines){ closeSheet(); return; }
  const sf = formState;
  const lines = Object.keys(qty).map(id=>{const i=byId[id],n=qty[id];return `<div class="line" data-id="${id}">
      <div class="nm">${esc(i.name)}<small> per ${esc(i.per)} · ${inr(i.price)} each</small></div>
      <div class="lt">${inr(n*i.price)}</div>
      <div class="stp"><button type="button" data-d="-1" aria-label="Remove one ${esc(i.name)}">−</button><input type="number" inputmode="numeric" min="0" value="${n}" aria-label="Quantity of ${esc(i.name)}"><button type="button" data-d="1" aria-label="Add one ${esc(i.name)}">+</button></div>
    </div>`}).join("");
  $("#sheetIn").innerHTML = `
    <div class="sheet-head"><h2 id="sheetTitle">Your order</h2><button class="x" type="button" id="closeSheet" aria-label="Close">×</button></div>
    <div id="lines">${lines}</div>
    <div class="total"><span>Total</span><span>${inr(t.total)}</span></div>
    <p class="fine">Delivery charges, if any, are confirmed by us on WhatsApp.</p>

    <h3>Delivery address</h3>
    <label for="fName">Full name</label><input class="in" id="fName" autocomplete="name" value="${esc2(sf.fName)}"><p class="err" id="e_fName"></p>
    <label for="fPhone">Mobile number</label><input class="in" id="fPhone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="${esc2(sf.fPhone)}"><p class="err" id="e_fPhone"></p>
    <label for="fEmail">Email (we send your order confirmation here)</label><input class="in" id="fEmail" type="email" inputmode="email" autocomplete="email" value="${esc2(sf.fEmail)}"><p class="err" id="e_fEmail"></p>
    <label for="fAddr">Address (house no, street, area)</label><textarea class="in" id="fAddr" autocomplete="street-address">${esc2(sf.fAddr)}</textarea><p class="err" id="e_fAddr"></p>
    <div class="two">
      <div><label for="fCity">Town / City</label><input class="in" id="fCity" autocomplete="address-level2" value="${esc2(sf.fCity)}"><p class="err" id="e_fCity"></p></div>
      <div><label for="fPin">Pincode</label><input class="in" id="fPin" inputmode="numeric" maxlength="6" autocomplete="postal-code" value="${esc2(sf.fPin)}"><p class="err" id="e_fPin"></p></div>
    </div>
    <label for="fNote">Note for us (optional)</label><input class="in" id="fNote" value="${esc2(sf.fNote)}">

    <div class="stack" style="margin-top:18px"><button class="btn confirm" type="button" id="confirmOrder">Confirm order - ${inr(t.total)}</button></div>`;
}
function openSheet(){
  orderId = orderId || newId();
  $("#sheet").classList.add("open"); document.body.style.overflow="hidden";
  renderSheet(); $("#sheet").scrollTop=0;
}
function closeSheet(){ $("#sheet").classList.remove("open"); document.body.style.overflow=""; }
$("#viewBtn").addEventListener("click", openSheet);

$("#sheet").addEventListener("click", e=>{
  if(e.target.closest("#closeSheet")||e.target.closest("#closeDone")){ closeSheet(); return; }
  const b = e.target.closest(".line button[data-d]");
  if(b){ const id=b.closest(".line").dataset.id; setQty(id,(qty[id]||0)+(+b.dataset.d)); return; }
  if(e.target.closest("#confirmOrder")){ if(validate(FORM_FIELDS)) finalize(); return; }
  if(e.target.closest("#newOrder")){ Object.keys(qty).forEach(k=>delete qty[k]); saveCart(); orderId=null; render($("#q").value); summary(); closeSheet(); window.scrollTo({top:0}); }
});
$("#sheet").addEventListener("input", e=>{
  if(e.target.matches(".line .stp input")){ const id=e.target.closest(".line").dataset.id; const v=parseInt(e.target.value,10); if(!isNaN(v)) setQty(id,v); }
  if(e.target.classList.contains("in")){
    formState[e.target.id]=e.target.value;
    try{ localStorage.setItem("pandyan_form",JSON.stringify(formState)); }catch(_){}
    e.target.classList.remove("bad"); const er=$("#e_"+e.target.id); if(er) er.textContent="";
  }
});

function copyText(txt,msg){
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(()=>toast(msg),()=>fallbackCopy(txt,msg)); }
  else fallbackCopy(txt,msg);
}
function fallbackCopy(txt,msg){ const ta=document.createElement("textarea"); ta.value=txt; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");toast(msg)}catch(e){toast("Copy not available")} ta.remove(); }

const FORM_FIELDS = ["fName","fPhone","fEmail","fAddr","fCity","fPin"];
const RULES = {
  fName: v=>v.length>=2 || "Enter your full name",
  fPhone: v=>/^[6-9]\d{9}$/.test(v) || "Enter a 10-digit mobile number",
  fEmail: v=>!v || /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v) || "Enter a valid email or leave it empty",
  fAddr: v=>v.length>=8 || "Enter your full address",
  fCity: v=>v.length>=2 || "Enter your town or city",
  fPin: v=>/^\d{6}$/.test(v) || "Enter a 6-digit pincode"
};
function val(id){ const el=$("#"+id); return (el ? el.value : (formState[id]||"")).trim(); }
function validate(ids){
  let first=null;
  ids.forEach(id=>{
    const el=$("#"+id), er=$("#e_"+id); if(!el) return;
    const r = RULES[id](val(id));
    if(r!==true){ el.classList.add("bad"); er.textContent=r; first=first||el; } else { el.classList.remove("bad"); er.textContent=""; }
  });
  if(first){ first.focus(); first.scrollIntoView({block:"center"}); return false; }
  return true;
}
function orderItems(){
  return Object.keys(qty).map(id=>{const i=byId[id],n=qty[id];return {no:i.no,name:i.name,per:i.per,price:i.price,qty:n,amount:n*i.price}});
}
function orderText(){
  const t=totals();
  const lines = orderItems().map(i=>`${i.no}. ${i.name} (per ${i.per}) x ${i.qty} = ${inr(i.amount)}`).join("\n");
  return `*New order ${orderId}* - ${SHOP.name}\n\n${lines}\n\n*Total: ${inr(t.total)}*\n\n*Name:* ${val("fName")}\n*Mobile:* ${val("fPhone")}${val("fEmail")?"\n*Email:* "+val("fEmail"):""}\n*Address:* ${val("fAddr")}, ${val("fCity")} - ${val("fPin")}`
    + (val("fNote")?`\n*Note:* ${val("fNote")}`:"")
}
function payload(){
  return {orderId, name:val("fName"), phone:val("fPhone"), email:val("fEmail"), address:val("fAddr"), city:val("fCity"), pin:val("fPin"), note:val("fNote"), total:totals().total, items:orderItems()};
}
function buildExcelFile(){
  const items = orderItems(), t = totals();
  const base = "Order-" + orderId;
  const rows = [["Product Name","Quantity","Total Price"]];
  items.forEach(i=>rows.push([i.name,i.qty,i.amount]));
  rows.push(["Overall Total","",t.total]);
  if(window.XLSX){
    const ws = XLSX.utils.aoa_to_sheet(rows);
    const last = rows.length;
    ws["C"+last] = {t:"n", v:t.total, f:"SUM(C2:C"+(last-1)+")"};
    ws["!cols"] = [{wch:34},{wch:10},{wch:14}];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Order");
    const buf = XLSX.write(wb,{bookType:"xlsx",type:"array"});
    return new File([buf], base+".xlsx", {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
  }
  const csv = rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\r\n");
  return new File(["\ufeff"+csv], base+".csv", {type:"text/csv"});
}
function downloadExcel(){
  const f = buildExcelFile();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(f); a.download = f.name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function waLinkFor(text){ return "https://wa.me/"+SHOP.whatsapp+"?text="+encodeURIComponent(text); }
/* Share message + Excel together (opens the phone's share sheet -> choose WhatsApp). Returns true if the share sheet was used. */
async function shareOrder(text){
  try{
    const file = buildExcelFile();
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], text:text, title:"Order "+orderId});
      return true;
    }
  }catch(e){ if(e && e.name==="AbortError") return true; }
  return false;
}
async function finalize(){
  const text = orderText(), t = totals();
  const waLink = waLinkFor(text);
  if(ORDER_WEBHOOK){
    fetch(ORDER_WEBHOOK,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload())}).catch(()=>{});
  }
  const hooked = !!ORDER_WEBHOOK;
  view="done";
  $("#sheetIn").innerHTML = `<div class="done" id="done">
    <h2>Order confirmed</h2><div class="oid">${orderId}</div>
    <p>${hooked ? "Your order and Excel file have been sent to us. WhatsApp is opening with your order message." : "Send your order and Excel file to us on WhatsApp."}</p>
    <p class="fine">Total ${inr(t.total)}. We will confirm your order on WhatsApp.</p>
    <div class="stack">
      ${hooked ? `<a class="btn confirm" href="${esc(waLink)}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Open WhatsApp</a>` : `<button class="btn confirm" type="button" id="shareWA">Send order + Excel on WhatsApp</button>
      <a class="btn alt" id="waOnly" href="${esc(waLink)}" target="_blank" rel="noopener" style="text-decoration:none;text-align:center">Message only (no Excel)</a>`}
      <button class="btn alt" type="button" id="dlExcel">Download Excel</button>
      <button class="btn alt" type="button" id="copyAgain">Copy order details</button>
      <button class="btn" type="button" id="newOrder">Start a new order</button>
      <button class="btn alt" type="button" id="closeDone">Back to price list</button>
    </div></div>`;
  $("#sheet").scrollTop=0;
  $("#copyAgain").onclick = ()=>copyText(text,"Order details copied");
  $("#dlExcel").onclick = ()=>downloadExcel();
  if(hooked){
    setTimeout(()=>{ const w = window.open(waLink,"_blank"); if(!w) window.location.href = waLink; }, 400);
    return;
  }
  $("#shareWA").onclick = async ()=>{
    if(!(await shareOrder(text))){ downloadExcel(); window.open(waLink,"_blank"); toast("Excel downloaded - attach it in WhatsApp"); }
  };
  if(!(await shareOrder(text))){
    downloadExcel();
    setTimeout(()=>{ const w = window.open(waLink,"_blank"); if(!w) window.location.href = waLink; }, 400);
  }
}
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && $("#sheet").classList.contains("open")) closeSheet(); });

render(""); summary();
</script>
